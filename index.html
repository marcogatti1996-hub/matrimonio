<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Video</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .hidden { display: none; }
    .intro-screen {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #eadfd6; text-align: center;
    }
    .video-container {
      position: fixed; inset: 0; background: black;
      display: flex; align-items: center; justify-content: center;
    }
    .video-container video { width: 100%; max-width: 900px; max-height: 100vh; }
  </style>
</head>
<body>

  <div id="intro-screen" class="intro-screen">
    <button id="startVideoBtn">Apri video</button>
  </div>

  <div id="video-container" class="video-container hidden">
    <video id="introVideo" playsinline controls preload="metadata">
      <source src="video/Video_Busta.mp4" type="video/mp4">
      Il tuo browser non supporta il video.
    </video>
  </div>

  <script>
    const startVideoBtn = document.getElementById("startVideoBtn");
    const introScreen = document.getElementById("intro-screen");
    const videoContainer = document.getElementById("video-container");
    const introVideo = document.getElementById("introVideo");

    console.log("JS caricato");

    startVideoBtn.addEventListener("click", () => {
      console.log("Click ok");
      introScreen.classList.add("hidden");
      videoContainer.classList.remove("hidden");
      introVideo.play().catch(err => console.log("Play error:", err));
    });

    introVideo.addEventListener("ended", () => {
      console.log("Video finito");
      alert("Video terminato");
    });
  </script>
</body>
</html>
