<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marco & Laura</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="intro-screen" class="intro-screen">
    <div class="overlay-light"></div>

    <div class="luxury-card">
      <p class="eyebrow">Wedding Invitation</p>
      <h1>Marco <span>&</span> Laura</h1>
      <div class="divider"></div>
      <p class="date">12 Giugno 2027</p>
      <p class="subtitle">Siete invitati ad aprire la nostra busta digitale</p>

      <button id="startVideoBtn" class="open-btn">
        Apri la busta
      </button>
    </div>
  </div>

  <div id="video-container" class="video-container hidden">
    <video id="introVideo" playsinline controls preload="auto">
      <source src="video/Video_Busta.mp4" type="video/mp4">
      Il tuo browser non supporta il video.
    </video>
  </div>

  <div id="invitation" class="invitation hidden">
    <section class="hero">
      <h1>Marco & Laura</h1>
      <p>12 Giugno 2027</p>
      <p>Benvenuti nel nostro sito di matrimonio 💕</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
