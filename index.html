<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marco & Giulia</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Georgia, serif;
    background:#f7efe4;
    overflow-x:hidden;
}

.hero{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    perspective:1500px;
}

.envelope{
    position:relative;
    width:350px;
    height:240px;
}

.envelope-body{
    position:absolute;
    width:100%;
    height:100%;
    background:#eadcc9;
    border-radius:8px;
    box-shadow:0 20px 40px rgba(0,0,0,.2);
}

.flap{
    position:absolute;
    top:0;
    left:0;

    width:100%;
    height:120px;

    background:#e2d1bc;

    clip-path:polygon(0 0,100% 0,50% 100%);

    transform-origin:top;
    transition:transform 1.5s ease;

    z-index:10;
}

.letter{
    position:absolute;
    left:20px;
    right:20px;
    top:20px;

    height:200px;

    background:white;

    border-radius:6px;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    transform:translateY(120px);

    transition:transform 2s ease;

    z-index:3;
}

.letter h1{
    color:#b08c57;
    margin-bottom:10px;
}

.seal{
    position:absolute;

    width:70px;
    height:70px;

    border-radius:50%;

    background:
    radial-gradient(circle at top left,
    #d84545,
    #8d1010);

    left:50%;
    top:65px;

    transform:translateX(-50%);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:28px;

    cursor:pointer;

    z-index:20;

    box-shadow:
    0 5px 15px rgba(0,0,0,.3);

    transition:
    transform .8s ease,
    opacity .8s ease;
}

.hint{
    margin-top:30px;
    color:#666;
}

.open .flap{
    transform:rotateX(180deg);
}

.open .letter{
    transform:translateY(-80px);
}

.open .seal{
    transform:
    translateX(-50%)
    scale(0);

    opacity:0;
}

.content{
    padding:100px 20px;
    max-width:900px;
    margin:auto;

    opacity:0;
    transition:opacity 2s ease;
}

.content.show{
    opacity:1;
}

.card{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:30px;
}

@media(max-width:500px){

    .envelope{
        width:300px;
        height:210px;
    }

    .letter{
        height:170px;
    }

    .letter h1{
        font-size:26px;
    }
}

</style>
</head>
<body>

<section class="hero">

    <div class="envelope" id="envelope">

        <div class="envelope-body"></div>

        <div class="letter">

            <h1>Marco & Giulia</h1>

            <p>
                12 Giugno 2027
            </p>

            <p>
                Vi invitiamo al nostro matrimonio
            </p>

        </div>

        <div class="flap"></div>

        <div class="seal" id="seal">
            ❤
        </div>

    </div>

    <p class="hint">
        Tocca il sigillo per aprire l'invito
    </p>

</section>

<section class="content" id="content">

    <div class="card">
        <h2>La nostra storia</h2>
        <br>
        <p>
            Qui potrai raccontare la vostra storia.
        </p>
    </div>

    <div class="card">
        <h2>Cerimonia</h2>
        <br>
        <p>
            Chiesa San...
        </p>
        <p>
            Ore 11:00
        </p>
    </div>

    <div class="card">
        <h2>Ricevimento</h2>
        <br>
        <p>
            Villa ...
        </p>
    </div>

</section>

<script>

document
.getElementById("seal")
.addEventListener("click", function(){

    document
    .getElementById("envelope")
    .classList
    .add("open");

    setTimeout(function(){

        document
        .getElementById("content")
        .classList
        .add("show");

        window.scrollTo({
            top:window.innerHeight,
            behavior:"smooth"
        });

    },1200);

});

</script>

</body>
</html>
