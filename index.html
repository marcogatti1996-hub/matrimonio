<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marco & Laura</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SCHERMATA INIZIALE -->
  <section id="intro-screen" class="screen intro-screen">
    <div class="luxury-card">
      <p class="eyebrow">Wedding Invitation</p>
      <h1>Marco <span>&</span> Laura</h1>
      <div class="divider"></div>
      <p class="date">12 Giugno 2027</p>
      <p class="subtitle">Siete invitati ad aprire la nostra busta digitale</p>

      <button id="startVideoBtn" class="open-btn">
        Apri la busta
      </button>
    </div>
  </section>

  <!-- VIDEO A SCHERMO INTERO -->
  <section id="video-container" class="fullscreen-layer hidden">
    <video id="introVideo" class="fullscreen-video" playsinline preload="auto" controls>
      <source src="video/Video_Busta.mp4" type="video/mp4">
      Il tuo browser non supporta il video.
    </video>
  </section>

  <!-- SITO FINALE -->
  <section id="invitation" class="screen invitation-screen hidden">
    <div class="site-content">
      <h1>Marco & Laura</h1>
      <p class="site-date">12 Giugno 2027</p>
      <p class="welcome">Benvenuti nel nostro sito di matrimonio 💕</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
